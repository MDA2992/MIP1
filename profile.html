<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Портфоліо науковця</title><style>
:root{--navy:#10265c;--blue:#1b65c9;--red:#ed2537;--line:#dce6f4}*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:var(--navy);font:16px Arial,system-ui,sans-serif}.wrap{max-width:1120px;margin:auto;padding:0 24px}header{background:white;border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between;padding:21px 0;gap:12px}.top a{color:var(--blue);text-decoration:none}.brand{font-weight:800}.back{display:inline-block;margin:26px 0;color:var(--blue);text-decoration:none}.hero{display:flex;gap:25px;align-items:center;padding:26px;background:white;border:1px solid var(--line);border-radius:15px}.avatar{width:160px;height:170px;border-radius:12px;background:linear-gradient(140deg,#cfe2ff,#8caee2);display:grid;place-items:center;font-size:65px;flex-shrink:0}h1{font-size:clamp(26px,4vw,40px);margin:0 0 8px}.degree{font-weight:bold;font-size:18px}.dept{color:#597098;margin-top:12px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}.tag{background:#edf4ff;color:#1958a7;border-radius:30px;padding:7px 11px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:20px}.stat strong{display:block;font-size:28px}.stat span{font-size:12px;color:#597098}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:24px;margin:16px 0}.panel h2{margin-top:0}.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px}.tabs button{white-space:nowrap;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--navy);font-weight:600;padding:15px 14px;cursor:pointer}.tabs button.active{border-color:var(--red);color:var(--red)}.item{padding:15px 0;border-bottom:1px solid var(--line);line-height:1.6}.item:last-child{border:0}.item strong{display:block}.item small{display:block;color:#60769b}.item p{margin:6px 0}.item a{color:var(--blue);overflow-wrap:anywhere}.notice{font-size:13px;color:#667a9a;margin:24px 0 35px}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.links a{color:var(--blue);font-size:14px}.hidden{display:none!important}@media(max-width:600px){.hero{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div class="wrap top"><div class="brand">МЕТІНВЕСТ ПОЛІТЕХНІКА</div><span id="language"></span></div></header><main class="wrap"><a class="back" id="back" href="index.html">← Усі науковці</a><section class="hero"><div class="avatar">👤</div><div><h1 id="name"></h1><div class="degree" id="degree"></div><div class="dept" id="dept"></div><div class="tags" id="tags"></div><div class="links" id="links"></div></div></section><section class="stats" id="stats"></section><section class="panel"><h2 id="aboutTitle"></h2><p id="bio"></p></section><section class="panel hidden" id="educationPanel"><h2 id="educationTitle"></h2><div id="education"></div></section><section class="panel"><div class="tabs" id="tabs"></div><div id="body"></div></section><p class="notice" id="notice"></p></main><script src="site.js"></script><script>
(async function(){
 const params=new URLSearchParams(location.search),L=params.get('lang')==='en'?'en':'ua';document.documentElement.lang=L;
 const tx={ua:{back:'← Усі науковці',about:'Про мене',education:'Освіта та кваліфікація',notice:'ДЕМОНСТРАЦІЯ: усі профілі, показники й досягнення вигадані.',missing:'Профіль не знайдено.',tabs:['Публікації','Проєкти','Викладання та наставництво','Практичний вплив','Визнання','Медіа'],stats:['Публікації Scopus/WoS','Дослідницькі проєкти','Патенти','Років промислової співпраці'],link:'Джерело'},en:{back:'← All researchers',about:'About',education:'Education and qualifications',notice:'DEMO: all profiles, metrics and achievements are fictional.',missing:'Researcher not found.',tabs:['Publications','Projects','Teaching & Mentoring','Practical Impact','Recognition','Media'],stats:['Scopus/WoS publications','Research projects','Patents','Years of industry collaboration'],link:'Source'}}[L];
 $('back').textContent=tx.back;$('back').href='index.html';$('aboutTitle').textContent=tx.about;$('educationTitle').textContent=tx.education;$('notice').textContent=tx.notice;
 const line=(title,sub,desc,url)=>{const link=validUrl(url);return '<div class="item"><strong>'+esc(title)+'</strong>'+(sub?'<small>'+esc(sub)+'</small>':'')+(desc?'<p>'+esc(desc)+'</p>':'')+(link?'<a target="_blank" rel="noopener noreferrer" href="'+esc(link)+'">'+esc(tx.link)+'</a>':'')+'</div>'};
 const choose=(p,ua,en)=>localized(p,ua,en,L);
 const records=(p,section)=>{let arr=[];for(let i=1;i<=5;i++){
 let title='',sub='',desc='',url='';const g=k=>get(p,i+'. '+k);
 if(section==='education'){title=choose(p,i+'. Кваліфікація, заклад (UA)',i+'. Qualification, institution (EN)');sub=g('Рік / період')}
 if(section==='publications'){title=g('Назва публікації (мовою оригіналу)');sub=[g('Рік'),g('Видання / джерело')].filter(Boolean).join(' · ');desc=choose(p,i+'. Короткий результат (UA)',i+'. Brief research outcome (EN)');url=g('DOI або URL')}
 if(section==='projects'){title=choose(p,i+'. Назва проєкту (UA)',i+'. Project title (EN)');sub=[g('Програма / донор'),g('Період'),choose(p,i+'. Роль науковця (UA)',i+'. Researcher role (EN)')].filter(Boolean).join(' · ');desc=choose(p,i+'. Результат / внесок (UA)',i+'. Result / contribution (EN)')}
 if(section==='teaching'){title=choose(p,i+'. Дисципліна або наставницька діяльність (UA)',i+'. Course or mentoring activity (EN)');desc=choose(p,i+'. Рівень / програма / результат (UA)',i+'. Level / programme / outcome (EN)')}
 if(section==='impact'){title=choose(p,i+'. Розробка / впровадження (UA)',i+'. Development / implementation (EN)');sub=g('Підприємство / партнер');desc=choose(p,i+'. Практичний результат (UA)',i+'. Practical outcome (EN)')}
 if(section==='recognition'){title=choose(p,i+'. Відзнака / грант / членство (UA)',i+'. Award / grant / membership (EN)');sub=g('Організація / підтвердження / URL');url=validUrl(sub)}
 if(section==='media'){title=choose(p,i+'. Назва матеріалу / події (UA)',i+'. Material / event title (EN)');sub=g('Формат / рік');url=g('URL')||g('Посилання')}
 if(title)arr.push(line(title,sub,desc,url));
 }return arr};
 try{const list=await loadResearchers(),p=list.find(x=>id(x)===params.get('id'));if(!p){$('name').textContent=tx.missing;$('stats').classList.add('hidden');document.querySelectorAll('.panel').forEach(e=>e.classList.add('hidden'));return}
 $('name').textContent=name(p,L);document.title=name(p,L)+' | Metinvest Polytechnic';$('degree').textContent=degree(p,L);$('dept').textContent=department(p,L);
 $('tags').innerHTML=interests(p,L).map(x=>'<span class="tag">'+esc(x)+'</span>').join('');$('bio').textContent=choose(p,'Про мене (UA, до 120 слів)','About me (EN, up to 120 words)');
 const links=[['ORCID',['ORCID','ORCID URL']],['Google Scholar',['Google Scholar','Google Scholar URL']],['Scopus',['Scopus','Scopus URL']],['Web of Science',['Web of Science','WoS']],['LinkedIn',['LinkedIn']]];
 $('links').innerHTML=links.map(([label,keys])=>{let url='';for(const k of keys){url=validUrl(get(p,k));if(url)break}return url?'<a target="_blank" rel="noopener noreferrer" href="'+esc(url)+'">'+esc(label)+'</a>':''}).join('');
 const metricKeys=['Кількість публікацій Scopus/WoS','Кількість дослідницьких проєктів','Кількість патентів','Років співпраці з промисловістю'];$('stats').innerHTML=metricKeys.map((key,i)=>{const v=get(p,key);return v!==''?'<div class="stat"><strong>'+esc(v)+'</strong><span>'+esc(tx.stats[i])+'</span></div>':''}).join('');if(!$('stats').innerHTML)$('stats').classList.add('hidden');
 const edu=records(p,'education');if(edu.length){$('educationPanel').classList.remove('hidden');$('education').innerHTML=edu.join('')}
 const sections=['publications','projects','teaching','impact','recognition','media'].map((key,i)=>({label:tx.tabs[i],html:records(p,key).join('')})).filter(s=>s.html);
 if(!sections.length){$('tabs').parentElement.classList.add('hidden');return}
 let active=0;function show(){ $('tabs').innerHTML=sections.map((s,i)=>'<button type="button" class="'+(active===i?'active':'')+'" data-index="'+i+'">'+esc(s.label)+'</button>').join('');$('body').innerHTML=sections[active].html;document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{active=Number(b.dataset.index);show()}))}show();
 }catch(err){console.error(err);$('name').textContent=L==='ua'?'Помилка завантаження даних':'Data loading error'}
})();
</script></body></html>
