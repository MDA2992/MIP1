<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Портфоліо науковця</title><style>:root{--navy:#10265c;--blue:#1b65c9;--red:#ed2537;--line:#dce6f4}*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:var(--navy);font:16px Arial,system-ui,sans-serif}.wrap{max-width:1120px;margin:auto;padding:0 24px}header{background:white;border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between;padding:21px 0;gap:12px}.top a{color:var(--blue);text-decoration:none}.brand{font-weight:800}.back{display:inline-block;margin:26px 0;color:var(--blue);text-decoration:none}.hero{display:flex;gap:25px;align-items:center;padding:26px;background:white;border:1px solid var(--line);border-radius:15px}.avatar{width:160px;height:170px;border-radius:12px;background:linear-gradient(140deg,#cfe2ff,#8caee2);display:grid;place-items:center;font-size:65px;flex-shrink:0}h1{font-size:clamp(26px,4vw,40px);margin:0 0 8px}.degree{font-weight:bold;font-size:18px}.dept{color:#597098;margin-top:12px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}.tag{background:#edf4ff;color:#1958a7;border-radius:30px;padding:7px 11px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:20px}.stat strong{display:block;font-size:28px}.stat span{font-size:12px;color:#597098}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:24px;margin:16px 0}.panel h2{margin-top:0}.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px}.tabs button{white-space:nowrap;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--navy);font-weight:600;padding:15px 14px;cursor:pointer}.tabs button.active{border-color:var(--red);color:var(--red)}.item{padding:15px 0;border-bottom:1px solid var(--line);line-height:1.6}.item:last-child{border:0}.notice{font-size:13px;color:#667a9a;margin:24px 0 35px}@media(max-width:600px){.hero{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:repeat(2,1fr)}} </style></head><body><header><div class="wrap top"><div class="brand">МЕТІНВЕСТ ПОЛІТЕХНІКА</div><a id="home" href="index.html">← Каталог науковців</a></div></header><main class="wrap"><a class="back" id="back" href="index.html">← Усі науковці</a><section class="hero"><div class="avatar">👤</div><div><h1 id="name"></h1><div class="degree" id="degree"></div><div class="dept" id="dept"></div><div class="tags" id="tags"></div></div></section><section class="stats"><div class="stat"><strong>—</strong><span id="s1"></span></div><div class="stat"><strong>—</strong><span id="s2"></span></div><div class="stat"><strong>—</strong><span id="s3"></span></div><div class="stat"><strong>—</strong><span id="s4"></span></div></section><section class="panel"><h2 id="aboutTitle"></h2><p id="bio"></p></section><section class="panel"><div class="tabs" id="tabs"></div><div id="body"></div></section><p class="notice" id="notice"></p></main><script src="site.js"></script><script>
const qs=new URLSearchParams(location.search);const p=people.find(x=>x.id===qs.get('id'))||people[0];const L=qs.get('lang')==='en'?'en':'ua';document.documentElement.lang=L;const labels={ua:['Публікації','Проєкти','Викладання та наставництво','Практичний вплив','Визнання','Медіа'],en:['Publications','Projects','Teaching & Mentoring','Practical Impact','Recognition','Media']};const texts={ua:{back:'← Усі науковці',about:'Про мене',notice:'Демонстраційне портфоліо. Реальні публікації, показники, контакти й досягнення потрібно додати після погодження науковцем.',empty:'Інформацію для цього розділу буде додано після заповнення та перевірки портфоліо.',stats:['Публікації','Дослідницькі проєкти','Патенти','Промислова співпраця']},en:{back:'← All researchers',about:'About',notice:'Demonstration portfolio. Verified publications, metrics, contacts and achievements will be added after researcher approval.',empty:'Content will be added after the portfolio is completed and verified.',stats:['Publications','Research projects','Patents','Industry collaboration']}};document.title=p.name[L]+' | Metinvest Polytechnic';$('home').textContent=texts[L].back;$('back').textContent=texts[L].back;$('home').href=$('back').href='index.html';$('name').textContent=p.name[L];$('degree').textContent=p.degree[L];$('dept').textContent=names[p.dept][L];$('tags').innerHTML=p.tags.map(k=>'<span class="tag">'+tags[k][L]+'</span>').join('');$('aboutTitle').textContent=texts[L].about;$('bio').textContent=p.bio[L];$('notice').textContent=texts[L].notice;for(let i=1;i<=4;i++)$('s'+i).textContent=texts[L].stats[i-1];let active=0;function tabs(){ $('tabs').innerHTML=labels[L].map((label,i)=>`<button class="${active===i?'active':''}" data-i="${i}">${label}</button>`).join('');$('body').innerHTML='<div class="item">'+texts[L].empty+'</div>';document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{active=+b.dataset.i;tabs()}))}tabs();
</script></body></html>
